<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global News Radar | Intelligence Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css?v=9">
</head>
<body class="dark-mode">
    <header>
        <div class="container">
            <h1>Global News Radar</h1>
            <button id="theme-toggle" aria-label="Toggle Dark/Light Mode">🌓</button>
        </div>
    </header>

    <main class="container">
        <section class="search-section">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Enter topic or keyword..." aria-label="Search topic">
                <select id="timeframe-select">
                    <option value="24h" selected>Last 24 Hours</option>
                    <option value="1h">Last 1 Hour</option>
                    <option value="15min">Last 15 Minutes</option>
                </select>
                <button id="search-btn">Search</button>
            </div>
            <div class="controls-row">
                <div class="refresh-controls">
                    <label class="toggle-container">
                        <input type="checkbox" id="auto-refresh-toggle">
                        <span class="toggle-label">Auto-Refresh</span>
                    </label>
                    <select id="refresh-interval" disabled>
                        <option value="300000">Every 5 Min</option>
                        <option value="900000">Every 15 Min</option>
                        <option value="1800000" selected>Every 30 Min</option>
                        <option value="3600000">Every 1 Hour</option>
                    </select>
                    <span id="next-refresh" class="hidden">Next refresh in: <span id="timer-val">--:--</span></span>
                </div>
            </div>
        </section>

        <div id="loader" class="hidden">
            <div class="spinner"></div>
            <p>Gathering global intelligence...</p>
        </div>

        <section id="results-section">
            <div id="dashboard-summary" class="summary-card hidden">
                <h2>Intelligence Executive Summary</h2>
                <p id="global-summary-text"></p>
                <div class="stats-grid">
                    <div class="stat-item">
                        <label>Sentiment</label>
                        <span id="sentiment-val">Neutral</span>
                    </div>
                    <div class="stat-item">
                        <label>Sources</label>
                        <span id="sources-count">0</span>
                    </div>
                </div>
                <div id="regional-analysis-box" class="analysis-box">
                    <h3>Regional Analysis</h3>
                    <p id="regional-analysis-text"></p>
                </div>
            </div>

            <div class="filters-bar">
                <div class="filter-header">
                    <h3>Aggregated Articles</h3>
                    <button id="clear-filters" class="btn-small hidden">Clear Filters</button>
                </div>
                <div class="filter-controls">
                    <div class="filter-group">
                        <label for="filter-source">Keyword</label>
                        <input type="text" id="filter-source" placeholder="Search in results...">
                    </div>
                    <div class="filter-group">
                        <label for="filter-region">Region</label>
                        <select id="filter-region">
                            <option value="">All Regions</option>
                            <option value="Europe">Europe</option>
                            <option value="Middle East">Middle East</option>
                            <option value="North America">North America</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-sentiment">Sentiment</label>
                        <select id="filter-sentiment">
                            <option value="">All Sentiments</option>
                            <option value="Positive">Positive</option>
                            <option value="Neutral">Neutral</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="articles-list" class="articles-grid">
                <!-- Articles will be injected here -->
            </div>
        </section>
    </main>

    <script src="/js/app.js?v=9" type="module"></script>
</body>
</html>
